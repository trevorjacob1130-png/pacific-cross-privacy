<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1B2550"/>
      <stop offset="0.55" stop-color="#0D1430"/>
      <stop offset="1" stop-color="#070B1A"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="0.5" stop-color="#FFC233"/>
      <stop offset="1" stop-color="#F08A0C"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4C7"/>
      <stop offset="1" stop-color="#FFB21E" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFC233" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFC233" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="262" r="190" fill="url(#glow)"/>
  <!-- crest -->
  <path d="M256 104 L380 146 V254 C380 330 324 382 256 410 C188 382 132 330 132 254 V146 Z"
        fill="url(#gold)" stroke="url(#rim)" stroke-width="6" stroke-linejoin="round"/>
  <!-- inner bevel -->
  <path d="M256 128 L358 162 V254 C358 316 312 360 256 384 C200 360 154 316 154 254 V162 Z"
        fill="none" stroke="#7A3E00" stroke-opacity="0.25" stroke-width="3" stroke-linejoin="round"/>
  <!-- T monogram -->
  <rect x="180" y="178" width="152" height="42" rx="9" fill="#0D1430"/>
  <rect x="235" y="178" width="42" height="170" rx="9" fill="#0D1430"/>
  <!-- sparkle -->
  <path d="M352 112 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6 z" fill="#FFF4C7"/>
</svg>
